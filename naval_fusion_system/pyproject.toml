[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "naval-fusion-system"
version = "0.1.0"
description = "Naval Warship Kinematic Multi-Sensor Fusion Engine with Heterogeneous EKF"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
    "pyright>=1.1.350",
    "bandit>=1.7.0",
]

[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "D", "UP", "B", "SIM", "S", "ASYNC", "RUF"
]
ignore = [
    "D400",  # Summary line doesn't need period per project standards
    "D415",  # First line punctuation
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D", "S105", "S106"]
"run.py" = ["T201", "S603", "S607"]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.11"
extraPaths = ["src"]
reportUnknownMemberType = "warning"
reportUntypedBaseClass = "warning"
reportUnnecessaryTypeIgnoreComment = "warning"
reportMissingTypeStubs = "none"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
]
