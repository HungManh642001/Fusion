[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "naval-isr"
version = "0.1.0"
description = "Naval Multi-Source ISR Reconnaissance Data Fusion (Radar, ESM, AIS, Spaceborne SAR, ST-GNN, DSmT PCR5)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "torch>=2.0.0",
    "matplotlib>=3.7.0",
    "folium>=0.15.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
